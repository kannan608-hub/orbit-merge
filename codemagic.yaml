workflows:
  ios-capacitor:
    name: Orbit Merge iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: orbitmerge_asc_key   # name this exactly whatever you call the API key connection in Codemagic > Team settings > Integrations > App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kamalakannan.orbitmerge
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
